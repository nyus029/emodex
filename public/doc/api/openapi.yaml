openapi: 3.1.0
info:
  title: Emodex API
  version: 0.1.0
  description: HTTP API for the Emodex Next.js application.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: example.com
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags:
        - Health
      summary: Database connectivity check
      responses:
        '200':
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealthResponse'
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chat/stream:
    post:
      tags:
        - Chat
      summary: Stream chat response
      description: Streams a text response from the chat agent. Falls back to a mock stream when `OPENAI_API_KEY` is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streamed chat response
          content:
            text/plain:
              schema:
                type: string
                description: Text stream from the chat agent.
        '400':
          description: Missing message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Agent is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/verify/{email}:
    get:
      tags:
        - Users
      summary: Verify whether a user exists by email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User existence flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifyResponse'
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups:
    get:
      tags:
        - Groups
      summary: List groups the current user belongs to
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupWithRole'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Groups
      summary: Create a new group
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get group detail
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Group detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Groups
      summary: Update group name
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Groups
      summary: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '204':
          description: Group deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}/members:
    get:
      tags:
        - Memberships
      summary: List members in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Memberships
      summary: Add a member to a group by email
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Membership already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}/members/{userId}:
    patch:
      tags:
        - Memberships
      summary: Update a member role
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Membership or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Memberships
      summary: Remove a member from a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '204':
          description: Membership removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Membership or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}:
    get:
      tags:
        - Albums
      summary: Get album overview
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
  /api/v1/albums/insight/{id}:
    get:
      tags:
        - Albums
      summary: Get album insight
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album insight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumInsightResponse'
  /api/v1/sentences:
    post:
      tags:
        - Sentences
      summary: Generate a sentence from words
      description: Uses LLM to create a natural Japanese sentence containing all the provided words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SentenceRequest'
      responses:
        '200':
          description: Generated sentence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentenceResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error or LLM service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello World
    DbHealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Database connection is healthy
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User input to the chat agent.
          example: 今日は何をすればいい？
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: message is required
        message:
          type: string
          description: Optional message field for certain errors.
    UserVerifyResponse:
      type: object
      properties:
        exists:
          type: boolean
          example: true
    Group:
      type: object
      properties:
        groupId:
          type: integer
          example: 1
        groupName:
          type: string
          example: My Group
        adminUserId:
          type: integer
          example: 10
    GroupWithRole:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            myRole:
              $ref: '#/components/schemas/MembershipRole'
    Membership:
      type: object
      properties:
        userId:
          type: integer
          example: 10
        email:
          type: string
          format: email
          example: user@example.com
        role:
          $ref: '#/components/schemas/MembershipRole'
    MembershipRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    CreateGroupRequest:
      type: object
      required:
        - groupName
      properties:
        groupName:
          type: string
          example: Product Launch Team
        memberEmails:
          type: array
          items:
            type: string
            format: email
          description: Optional list of member emails to add as MEMBERS
    UpdateGroupRequest:
      type: object
      required:
        - groupName
      properties:
        groupName:
          type: string
          example: Updated Group Name
    AddMemberRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/MembershipRole'
    UpdateMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
    Album:
      type: object
      required:
        - id
        - albumBasicInfo
        - updateNotification
        - dividendNotification
      properties:
        id:
          type: string
          example: abc123
        albumBasicInfo:
          $ref: '#/components/schemas/AlbumBasicInfo'
        updateNotification:
          $ref: '#/components/schemas/AlbumUpdateNotification'
        dividendNotification:
          $ref: '#/components/schemas/AlbumDividendNotification'
    AlbumBasicInfo:
      type: object
      required:
        - albumName
        - createdAt
        - plannedDividend
        - createdTags
        - requiredAtAlbumCreation
      properties:
        albumName:
          type: string
          example: 思い出アルバム
        createdAt:
          type: string
          format: date-time
          example: '2026-02-13T00:00:00.000Z'
        plannedDividend:
          type: string
          example: '2026-03-31'
        createdTags:
          type: array
          items:
            type: string
          example:
            - 家族
            - 旅行
            - イベント
        requiredAtAlbumCreation:
          type: boolean
          example: true
    AlbumUpdateNotification:
      type: object
      properties:
        addedFolderHistory:
          type: array
          items:
            type: object
            properties:
              folderName:
                type: string
                example: 2026_01_京都旅行
              addedAt:
                type: string
                format: date-time
                example: '2026-01-15T09:30:00.000Z'
    AlbumDividendNotification:
      type: object
      properties:
        recordedAtTransaction:
          type: boolean
          example: true
        dividendDates:
          type: array
          items:
            type: string
            example: '2025-12-31'
    AlbumInsightResponse:
      type: object
      required:
        - albumBasicInfo
        - emoValueInfo
      properties:
        albumBasicInfo:
          type: object
          properties:
            name:
              type: string
              example: Album 123
            createdAt:
              type: string
              format: date
              example: '2026-02-01'
            dividend:
              type: string
              example: ¥1,250
        emoValueInfo:
          type: object
          properties:
            emoValue:
              type: number
              example: 8500
            dayOverDayChange:
              $ref: '#/components/schemas/EmoValueChange'
    EmoValueChange:
      type: object
      properties:
        value:
          type: number
          example: 125
        percentage:
          type: number
          format: float
          example: 1.49
    SentenceRequest:
      type: object
      required:
        - words
      properties:
        words:
          type: array
          items:
            type: string
          example:
            - 猫
            - 走る
            - 公園
    SentenceResponse:
      type: object
      properties:
        sentence:
          type: string
          example: 公園で元気よく猫が走る様子を眺めていた。
        wordCount:
          type: integer
          example: 3
        usedWords:
          type: array
          items:
            type: string
          example:
            - 猫
            - 走る
            - 公園
