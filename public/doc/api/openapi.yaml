openapi: 3.1.0
info:
  title: Emodex API
  version: 0.1.0
  description: HTTP API for the Emodex Next.js application.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: example.com
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags:
        - Health
      summary: Database connectivity check
      responses:
        '200':
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealthResponse'
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chat/stream:
    post:
      tags:
        - Chat
      summary: Stream chat response
      description: Streams a text response from the chat agent. Falls back to a mock stream when `OPENAI_API_KEY` is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streamed chat response
          content:
            text/plain:
              schema:
                type: string
                description: Text stream from the chat agent.
        '400':
          description: Missing message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Agent is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/blob/upload:
    post:
      tags:
        - Blob
      summary: Generate client upload token for Vercel Blob
      description: Used by `@vercel/blob/client upload()` for direct browser uploads.
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - clientToken
                properties:
                  type:
                    type: string
                    example: blob.generate-client-token
                  clientToken:
                    type: string
                    description: Token for direct browser upload.
                    example: vercel_blob_client_token_xxx
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/blob/delete:
    post:
      tags:
        - Blob
      summary: Delete uploaded blobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uri
      responses:
        '200':
          description: Blobs deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
                    minimum: 0
                    example: 2
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}:
    get:
      tags:
        - Albums
      summary: Get album overview
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums:
    post:
      tags:
        - Albums
      summary: Create album
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlbumRequest'
      responses:
        '201':
          description: Album created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Album with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/photo-storages:
    post:
      tags:
        - Albums
      summary: Add photo storages to album in bulk
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPhotoStoragesRequest'
      responses:
        '201':
          description: Photo storages added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddPhotoStoragesResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: photo_storage name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/insight/{id}:
    get:
      tags:
        - Albums
      summary: Get album insight
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album insight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumInsightResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello World
    DbHealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Database connection is healthy
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User input to the chat agent.
          example: 今日は何をすればいい？
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: message is required
        message:
          type: string
          description: Optional message field for certain errors.
    Album:
      type: object
      required:
        - id
        - albumBasicInfo
        - photoStorageSummary
        - photoStorages
      properties:
        id:
          type: string
          example: abc123
        albumBasicInfo:
          $ref: '#/components/schemas/AlbumBasicInfo'
        photoStorageSummary:
          $ref: '#/components/schemas/PhotoStorageSummary'
        photoStorages:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PhotoStorage'
    AlbumBasicInfo:
      type: object
      required:
        - albumName
        - createdAt
        - rootPath
        - plannedDividend
        - createdTags
        - requiredAtAlbumCreation
      properties:
        albumName:
          type: string
          example: 思い出アルバム
        createdAt:
          type: string
          format: date-time
          example: '2026-02-13T00:00:00.000Z'
        rootPath:
          type: string
          example: 家族アルバム
        plannedDividend:
          type:
            - string
            - 'null'
          example: '2026-03-31'
        createdTags:
          type: array
          items:
            type: string
          example:
            - 家族
            - 旅行
            - イベント
        requiredAtAlbumCreation:
          type: boolean
          example: true
    PhotoStorageSummary:
      type: object
      required:
        - totalStorages
        - totalPhotos
        - totalSizeBytes
        - lastAddedAt
      properties:
        totalStorages:
          type: integer
          minimum: 0
          example: 2
        totalPhotos:
          type: integer
          minimum: 0
          example: 12
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 0
          example: 1099511
        lastAddedAt:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-02-18T10:30:00.000Z'
    PhotoStorage:
      type: object
      required:
        - id
        - name
        - storagePath
        - photoCount
        - totalSizeBytes
        - createdAt
        - photos
      properties:
        id:
          type: string
          example: ps_123
        name:
          type: string
          example: 2026-02-旅行
        storagePath:
          type: string
          example: 家族アルバム/2026-02-旅行
        photoCount:
          type: integer
          minimum: 1
          example: 8
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 1
          example: 8123456
        createdAt:
          type: string
          format: date-time
          example: '2026-02-18T10:30:00.000Z'
        photos:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PhotoStoragePhoto'
    PhotoStoragePhoto:
      type: object
      required:
        - id
        - fileName
        - blobPath
        - blobUrl
        - sizeBytes
      properties:
        id:
          type: string
          example: psp_123
        fileName:
          type: string
          example: IMG_0001.JPG
        blobPath:
          type: string
          example: 家族アルバム/2026-02-旅行/1700000000-1-IMG_0001.JPG
        blobUrl:
          type: string
          format: uri
          example: https://example.public.blob.vercel-storage.com/xxx.jpg
        contentType:
          type:
            - string
            - 'null'
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          example: 2048000
    CreateAlbumRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: 家族アルバム
        plannedDividend:
          type: string
          format: date-time
          example: '2026-03-31T00:00:00.000Z'
        createdTags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
          example:
            - 家族
            - 旅行
        requiredAtAlbumCreation:
          type: boolean
          example: false
    AddPhotoStoragesRequest:
      type: object
      required:
        - name
        - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: 2026-02-旅行
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required:
              - fileName
              - blobPath
              - blobUrl
              - sizeBytes
            properties:
              fileName:
                type: string
                example: IMG_0001.JPG
              blobPath:
                type: string
                example: 家族アルバム/2026-02-旅行/1700000000-1-IMG_0001.JPG
              blobUrl:
                type: string
                format: uri
                example: https://example.public.blob.vercel-storage.com/xxx.jpg
              contentType:
                type: string
                example: image/jpeg
              sizeBytes:
                type: integer
                minimum: 1
                example: 2048000
    AddPhotoStoragesResponse:
      type: object
      required:
        - albumId
        - photoStorage
      properties:
        albumId:
          type: string
          example: abc123
        photoStorage:
          $ref: '#/components/schemas/PhotoStorage'
    AlbumInsightResponse:
      type: object
      required:
        - albumBasicInfo
        - emoValueInfo
      properties:
        albumBasicInfo:
          type: object
          properties:
            name:
              type: string
              example: Album 123
            createdAt:
              type: string
              format: date
              example: '2026-02-01'
            dividend:
              type: string
              example: ¥1,250
        emoValueInfo:
          type: object
          properties:
            emoValue:
              type: number
              example: 8500
            dayOverDayChange:
              $ref: '#/components/schemas/EmoValueChange'
    EmoValueChange:
      type: object
      properties:
        value:
          type: number
          example: 125
        percentage:
          type: number
          format: float
          example: 1.49
