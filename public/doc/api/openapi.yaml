openapi: 3.1.0
info:
  title: Emodex API
  version: 0.1.0
  description: HTTP API for the Emodex Next.js application.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: example.com
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags:
        - Health
      summary: Database connectivity check
      responses:
        '200':
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealthResponse'
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health/storage:
    get:
      tags:
        - Health
      summary: Mastra storage backend check
      description: Returns whether Mastra storage is using Turso or local file (file or file_tmp on Vercel).
      responses:
        '200':
          description: Storage backend type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageHealthResponse'
  /api/chat/stream:
    post:
      tags:
        - Chat
      summary: Stream chat response
      description: Streams a text response from the chat agent. Falls back to a mock stream when `OPENAI_API_KEY` is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streamed chat response
          content:
            text/plain:
              schema:
                type: string
                description: Text stream from the chat agent.
        '400':
          description: Missing message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Agent is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/blob/upload:
    post:
      tags:
        - Blob
      summary: Generate client upload token for Vercel Blob
      description: Used by `@vercel/blob/client upload()` for direct browser uploads.
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - clientToken
                properties:
                  type:
                    type: string
                    example: blob.generate-client-token
                  clientToken:
                    type: string
                    description: Token for direct browser upload.
                    example: vercel_blob_client_token_xxx
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/blob/delete:
    post:
      tags:
        - Blob
      summary: Delete uploaded blobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uri
      responses:
        '200':
          description: Blobs deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
                    minimum: 0
                    example: 2
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/verify/{email}:
    get:
      tags:
        - Users
      summary: Verify whether a user exists by email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User existence flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifyResponse'
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups:
    get:
      tags:
        - Groups
      summary: List groups the current user belongs to
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupWithRole'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Groups
      summary: Create a new group
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get group detail
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Group detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Groups
      summary: Update group name
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Groups
      summary: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '204':
          description: Group deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}/members:
    get:
      tags:
        - Memberships
      summary: List members in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Memberships
      summary: Add a member to a group by email
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Membership already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}/members/{userId}:
    patch:
      tags:
        - Memberships
      summary: Update a member role
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Membership or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Memberships
      summary: Remove a member from a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '204':
          description: Membership removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Membership or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}:
    get:
      tags:
        - Albums
      summary: Get album overview
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums:
    get:
      tags:
        - Albums
      summary: List accessible albums
      description: Returns albums owned by the user and shared albums from groups the user belongs to.
      responses:
        '200':
          description: Album list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumListItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Albums
      summary: Create album
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlbumRequest'
      responses:
        '201':
          description: Album created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of the specified group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Album with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/photo-storages:
    post:
      tags:
        - Albums
      summary: Add photo storages to album in bulk
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPhotoStoragesRequest'
      responses:
        '201':
          description: Photo storages added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddPhotoStoragesResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: photo_storage name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/insight:
    get:
      tags:
        - Albums
      summary: Get insight overview for all accessible albums
      description: Returns total emo value and per-album emo values with day-over-day changes.
      responses:
        '200':
          description: Insight overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightOverviewResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/insight/{id}:
    get:
      tags:
        - Albums
      summary: Get album insight with emo value
      description: Returns album basic info and calculated emo value with compound interest.
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album insight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumInsightResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/dividend:
    post:
      tags:
        - Albums
      summary: Execute dividend action
      description: Execute a dividend reinvest or receive action on an album that has reached its planned dividend date.
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DividendActionRequest'
      responses:
        '200':
          description: Dividend action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendActionResponse'
        '400':
          description: Invalid request or dividend date not reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album or photo storage not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dividend already executed for this storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dividend:
    get:
      tags:
        - Dividend
      summary: List pending and completed dividends
      description: Returns pending (actionable) and completed dividend items for all accessible albums, grouped by photo storage.
      responses:
        '200':
          description: Dividend list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dividend/{eventId}:
    get:
      tags:
        - Dividend
      summary: Get dividend event detail
      description: Returns dividend event details including the associated photo storage and its photos.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Dividend event identifier
          schema:
            type: string
      responses:
        '200':
          description: Dividend event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendEventDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dividend event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/chart:
    get:
      tags:
        - Albums
      summary: Get album emo value chart data
      description: Returns time-series emo value data aggregated from EmoSnapshots with on-demand today calculation.
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Chart period
          schema:
            type: string
            enum:
              - 1W
              - 1M
              - 3M
              - 1Y
              - ALL
            default: 1M
      responses:
        '200':
          description: Chart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDataResponse'
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cron/emo-snapshots:
    get:
      tags:
        - Cron
      summary: Daily emo snapshot batch
      description: Calculates and upserts emo snapshots for all active photo storages. Protected by CRON_SECRET.
      responses:
        '200':
          description: Snapshots created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  snapshotsUpserted:
                    type: integer
                    example: 42
                  date:
                    type: string
                    format: date
                    example: '2026-02-21'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/groups:
    get:
      tags:
        - Groups
      summary: List groups for the current user (Auth0 session)
      description: Returns groups the authenticated user belongs to, using Auth0 session for authentication.
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyGroup'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sentences:
    post:
      tags:
        - Sentences
      summary: Generate a sentence from words
      description: Uses LLM to create a natural Japanese sentence containing all the provided words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SentenceRequest'
      responses:
        '200':
          description: Generated sentence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentenceResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error or LLM service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello World
    DbHealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Database connection is healthy
    StorageHealthResponse:
      type: object
      required:
        - mastraStorage
        - tursoConfigured
      properties:
        mastraStorage:
          type: string
          description: Storage backend. One of file, file_tmp, turso.
          example: file
        tursoConfigured:
          type: boolean
          description: True when Mastra storage is Turso (TURSO_DATABASE_URL set).
          example: false
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User input to the chat agent.
          example: 今日は何をすればいい？
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: message is required
        message:
          type: string
          description: Optional message field for certain errors.
    UserVerifyResponse:
      type: object
      properties:
        exists:
          type: boolean
          example: true
    Group:
      type: object
      properties:
        groupId:
          type: integer
          example: 1
        groupName:
          type: string
          example: My Group
        adminUserId:
          type: integer
          example: 10
    GroupWithRole:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            myRole:
              $ref: '#/components/schemas/MembershipRole'
    Membership:
      type: object
      properties:
        userId:
          type: integer
          example: 10
        email:
          type: string
          format: email
          example: user@example.com
        role:
