openapi: 3.1.0
info:
  title: Emodex API
  version: 0.1.0
  description: HTTP API for the Emodex Next.js application.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: example.com
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/db:
    get:
      tags:
        - Health
      summary: Database connectivity check
      responses:
        '200':
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbHealthResponse'
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health/storage:
    get:
      tags:
        - Health
      summary: Mastra storage backend check
      description: Returns whether Mastra storage is using Turso or local file (file or file_tmp on Vercel).
      responses:
        '200':
          description: Storage backend type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageHealthResponse'
  /api/chat/stream:
    post:
      tags:
        - Chat
      summary: Stream chat response
      description: Streams a text response from the chat agent. Falls back to a mock stream when `OPENAI_API_KEY` is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streamed chat response
          content:
            text/plain:
              schema:
                type: string
                description: Text stream from the chat agent.
        '400':
          description: Missing message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Agent is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/blob/upload:
    post:
      tags:
        - Blob
      summary: Generate client upload token for Vercel Blob
      description: Used by `@vercel/blob/client upload()` for direct browser uploads.
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - clientToken
                properties:
                  type:
                    type: string
                    example: blob.generate-client-token
                  clientToken:
                    type: string
                    description: Token for direct browser upload.
                    example: vercel_blob_client_token_xxx
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/blob/delete:
    post:
      tags:
        - Blob
      summary: Delete uploaded blobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uri
      responses:
        '200':
          description: Blobs deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
                    minimum: 0
                    example: 2
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/verify/{email}:
    get:
      tags:
        - Users
      summary: Verify whether a user exists by email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User existence flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVerifyResponse'
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups:
    get:
      tags:
        - Groups
      summary: List groups the current user belongs to
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupWithRole'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Groups
      summary: Create a new group
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get group detail
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Group detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Groups
      summary: Update group name
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Groups
      summary: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '204':
          description: Group deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}/members:
    get:
      tags:
        - Memberships
      summary: List members in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Memberships
      summary: Add a member to a group by email
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Membership already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/groups/{groupId}/members/{userId}:
    patch:
      tags:
        - Memberships
      summary: Update a member role
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Membership or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Memberships
      summary: Remove a member from a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: true
          description: Authenticated user id
          schema:
            type: integer
      responses:
        '204':
          description: Membership removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Membership or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}:
    get:
      tags:
        - Albums
      summary: Get album overview
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums:
    get:
      tags:
        - Albums
      summary: List accessible albums
      description: Returns albums owned by the user and shared albums from groups the user belongs to.
      responses:
        '200':
          description: Album list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumListItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Albums
      summary: Create album
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlbumRequest'
      responses:
        '201':
          description: Album created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of the specified group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Album with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/photo-storages:
    post:
      tags:
        - Albums
      summary: Add photo storages to album in bulk
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPhotoStoragesRequest'
      responses:
        '201':
          description: Photo storages added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddPhotoStoragesResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: photo_storage name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/insight:
    get:
      tags:
        - Albums
      summary: Get insight overview for all accessible albums
      description: Returns total emo value and per-album emo values with day-over-day changes.
      responses:
        '200':
          description: Insight overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightOverviewResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/insight/{id}:
    get:
      tags:
        - Albums
      summary: Get album insight with emo value
      description: Returns album basic info and calculated emo value with compound interest.
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      responses:
        '200':
          description: Album insight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumInsightResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/dividend:
    post:
      tags:
        - Albums
      summary: Execute dividend action
      description: Execute a dividend reinvest or receive action on an album that has reached its planned dividend date.
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DividendActionRequest'
      responses:
        '200':
          description: Dividend action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendActionResponse'
        '400':
          description: Invalid request or dividend date not reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album or photo storage not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dividend already executed for this storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dividend:
    get:
      tags:
        - Dividend
      summary: List pending and completed dividends
      description: Returns pending (actionable) dividend items, approval requests awaiting member consent, and completed dividend items for all accessible albums.
      responses:
        '200':
          description: Dividend list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dividend/{eventId}:
    get:
      tags:
        - Dividend
      summary: Get dividend event detail
      description: Returns dividend event details including the associated photo storage and its photos.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Dividend event identifier
          schema:
            type: string
      responses:
        '200':
          description: Dividend event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendEventDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dividend event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/dividend/approvals/{requestId}:
    get:
      tags:
        - Dividend
      summary: Get dividend approval request detail
      description: Returns the detail of a dividend approval request including all member approvals and status.
      parameters:
        - name: requestId
          in: path
          required: true
          description: Dividend approval request identifier
          schema:
            type: string
      responses:
        '200':
          description: Approval request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendApprovalRequestDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Dividend
      summary: Approve a dividend approval request
      description: Approves a pending dividend request for the current user. When all group members approve, the dividend is automatically executed.
      parameters:
        - name: requestId
          in: path
          required: true
          description: Dividend approval request identifier
          schema:
            type: string
      responses:
        '200':
          description: Approval recorded (or dividend executed if all approved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendApprovalResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already approved or request not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Approval request has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{id}/chart:
    get:
      tags:
        - Albums
      summary: Get album emo value chart data
      description: Returns time-series emo value data aggregated from EmoSnapshots with on-demand today calculation.
      parameters:
        - name: id
          in: path
          required: true
          description: Album identifier
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Chart period
          schema:
            type: string
            enum:
              - 1W
              - 1M
              - 3M
              - 1Y
              - ALL
            default: 1M
      responses:
        '200':
          description: Chart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartDataResponse'
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cron/emo-snapshots:
    get:
      tags:
        - Cron
      summary: Daily emo snapshot batch
      description: Calculates and upserts emo snapshots for all active photo storages. Protected by CRON_SECRET.
      responses:
        '200':
          description: Snapshots created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  snapshotsUpserted:
                    type: integer
                    example: 42
                  date:
                    type: string
                    format: date
                    example: '2026-02-21'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cron/expired-photos:
    get:
      tags:
        - Cron
      summary: Delete expired photo blobs
      description: Deletes Vercel Blob files for RECEIVE events older than 7 days where storage is still inactive. Protected by CRON_SECRET.
      responses:
        '200':
          description: Expired photos cleaned up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  storagesProcessed:
                    type: integer
                    example: 5
                  blobsDeleted:
                    type: integer
                    example: 42
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cron/dividend-auto-receive:
    get:
      tags:
        - Cron
      summary: Auto receive due dividends
      description: Executes RECEIVE dividends for due active storages (plannedDividend <= now) when no RECEIVE event exists since planned dividend date. Also enforces the existing 7-day receive cooldown. Protected by CRON_SECRET.
      responses:
        '200':
          description: Auto dividend receive completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  processedStorages:
                    type: integer
                    example: 10
                  createdEvents:
                    type: integer
                    example: 8
                  skippedReasonCounts:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      already_received_since_planned_dividend: 1
                      receive_cooldown: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/groups:
    get:
      tags:
        - Groups
      summary: List groups for the current user (Auth0 session)
      description: Returns groups the authenticated user belongs to, using Auth0 session for authentication.
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyGroup'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sentences:
    post:
      tags:
        - Sentences
      summary: Generate a sentence from words
      description: Uses LLM to create a natural Japanese sentence containing all the provided words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SentenceRequest'
      responses:
        '200':
          description: Generated sentence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentenceResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error or LLM service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/mood/sentence:
    post:
      tags:
        - Mood
      summary: Generate and save mood sentence from words
      description: |
        Requires Auth0 session. Generates a sentence that expresses the user's mood/mental state from the given words, optionally generates a "therefore you need to feel ~" recommendation, and saves the record linked to the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodSentenceRequest'
      responses:
        '200':
          description: Mood sentence saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoodSentenceResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server or LLM error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/mood/suggested-albums:
    get:
      tags:
        - Mood
      summary: Get albums suggested by current mood
      description: |
        Requires Auth0 session. Returns albums that match the user's latest saved mood sentence, so the user knows which albums to view.
      responses:
        '200':
          description: Suggested albums for the mood
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedAlbumsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No mood record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello World
    DbHealthResponse:
      type: object
      properties:
        message:
          type: string
          example: Database connection is healthy
    StorageHealthResponse:
      type: object
      required:
        - mastraStorage
        - tursoConfigured
      properties:
        mastraStorage:
          type: string
          description: Storage backend. One of file, file_tmp, turso.
          example: file
        tursoConfigured:
          type: boolean
          description: True when Mastra storage is Turso (TURSO_DATABASE_URL set).
          example: false
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: User input to the chat agent.
          example: 今日は何をすればいい？
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: message is required
        message:
          type: string
          description: Optional message field for certain errors.
    UserVerifyResponse:
      type: object
      properties:
        exists:
          type: boolean
          example: true
    Group:
      type: object
      properties:
        groupId:
          type: integer
          example: 1
        groupName:
          type: string
          example: My Group
        adminUserId:
          type: integer
          example: 10
    GroupWithRole:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            myRole:
              $ref: '#/components/schemas/MembershipRole'
    Membership:
      type: object
      properties:
        userId:
          type: integer
          example: 10
        email:
          type: string
          format: email
          example: user@example.com
        role:
          $ref: '#/components/schemas/MembershipRole'
    MembershipRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    MyGroup:
      type: object
      required:
        - groupId
        - groupName
        - myRole
      properties:
        groupId:
          type: integer
          example: 1
        groupName:
          type: string
          example: Product Launch Team
        myRole:
          $ref: '#/components/schemas/MembershipRole'
    CreateGroupRequest:
      type: object
      required:
        - groupName
      properties:
        groupName:
          type: string
          example: Product Launch Team
        memberEmails:
          type: array
          items:
            type: string
            format: email
          description: Optional list of member emails to add as MEMBERS
    UpdateGroupRequest:
      type: object
      required:
        - groupName
      properties:
        groupName:
          type: string
          example: Updated Group Name
    AddMemberRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/MembershipRole'
    UpdateMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
    Album:
      type: object
      required:
        - id
        - albumBasicInfo
        - photoStorageSummary
        - photoStorages
      properties:
        id:
          type: string
          example: abc123
        albumBasicInfo:
          $ref: '#/components/schemas/AlbumBasicInfo'
        photoStorageSummary:
          $ref: '#/components/schemas/PhotoStorageSummary'
        photoStorages:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PhotoStorage'
    AlbumType:
      type: string
      enum:
        - PRIVATE
        - SHARED
    AlbumListItem:
      type: object
      required:
        - id
        - name
        - albumType
        - rootPath
        - groupId
        - groupName
        - createdTags
        - photoStorageCount
      properties:
        id:
          type: string
          example: abc123
        name:
          type: string
          example: 家族アルバム
        albumType:
          $ref: '#/components/schemas/AlbumType'
        rootPath:
          type: string
          example: 家族アルバム
        groupId:
          type:
            - integer
            - 'null'
          example: null
        groupName:
          type:
            - string
            - 'null'
          example: null
        createdTags:
          type: array
          items:
            type: string
          example:
            - 家族
            - 旅行
        photoStorageCount:
          type: integer
          minimum: 0
          example: 3
    AlbumBasicInfo:
      type: object
      required:
        - albumName
        - createdAt
        - rootPath
        - albumType
        - groupId
        - groupName
        - plannedDividend
        - createdTags
        - requiredAtAlbumCreation
      properties:
        albumName:
          type: string
          example: 思い出アルバム
        createdAt:
          type: string
          format: date-time
          example: '2026-02-13T00:00:00.000Z'
        rootPath:
          type: string
          example: 家族アルバム
        albumType:
          $ref: '#/components/schemas/AlbumType'
        groupId:
          type:
            - integer
            - 'null'
          example: null
        groupName:
          type:
            - string
            - 'null'
          example: null
        plannedDividend:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-03-31T00:00:00.000Z'
        createdTags:
          type: array
          items:
            type: string
          example:
            - 家族
            - 旅行
            - イベント
        requiredAtAlbumCreation:
          type: boolean
          example: true
    PhotoStorageSummary:
      type: object
      required:
        - totalStorages
        - totalPhotos
        - totalSizeBytes
        - lastAddedAt
      properties:
        totalStorages:
          type: integer
          minimum: 0
          example: 2
        totalPhotos:
          type: integer
          minimum: 0
          example: 12
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 0
          example: 1099511
        lastAddedAt:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-02-18T10:30:00.000Z'
    PhotoStorage:
      type: object
      required:
        - id
        - name
        - storagePath
        - photoCount
        - totalSizeBytes
        - tags
        - createdAt
        - photos
      properties:
        id:
          type: string
          example: ps_123
        name:
          type: string
          example: 2026-02-旅行
        storagePath:
          type: string
          example: 家族アルバム/2026-02-旅行
        photoCount:
          type: integer
          minimum: 1
          example: 8
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 1
          example: 8123456
        tags:
          type: array
          items:
            type: string
          example:
            - 旅行
            - 家族
        createdAt:
          type: string
          format: date-time
          example: '2026-02-18T10:30:00.000Z'
        photos:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PhotoStoragePhoto'
    PhotoStoragePhoto:
      type: object
      required:
        - id
        - fileName
        - blobPath
        - blobUrl
        - sizeBytes
      properties:
        id:
          type: string
          example: psp_123
        fileName:
          type: string
          example: IMG_0001.JPG
        blobPath:
          type: string
          example: 家族アルバム/2026-02-旅行/1700000000-1-IMG_0001.JPG
        blobUrl:
          type: string
          format: uri
          example: https://example.public.blob.vercel-storage.com/xxx.jpg
        contentType:
          type:
            - string
            - 'null'
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          example: 2048000
    CreateAlbumRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: 家族アルバム
        albumType:
          $ref: '#/components/schemas/AlbumType'
        groupId:
          type: integer
          description: Required when albumType is SHARED
          example: 1
        plannedDividend:
          type: string
          format: date-time
          example: '2026-03-31T00:00:00.000Z'
        createdTags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
          example:
            - 家族
            - 旅行
        requiredAtAlbumCreation:
          type: boolean
          example: false
    AddPhotoStoragesRequest:
      type: object
      required:
        - name
        - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: 2026-02-旅行
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
          example:
            - 旅行
            - 家族
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required:
              - fileName
              - blobPath
              - blobUrl
              - sizeBytes
            properties:
              fileName:
                type: string
                example: IMG_0001.JPG
              blobPath:
                type: string
                example: 家族アルバム/2026-02-旅行/1700000000-1-IMG_0001.JPG
              blobUrl:
                type: string
                format: uri
                example: https://example.public.blob.vercel-storage.com/xxx.jpg
              contentType:
                type: string
                example: image/jpeg
              sizeBytes:
                type: integer
                minimum: 1
                example: 2048000
    AddPhotoStoragesResponse:
      type: object
      required:
        - albumId
        - photoStorage
      properties:
        albumId:
          type: string
          example: abc123
        photoStorage:
          $ref: '#/components/schemas/PhotoStorage'
    AlbumInsightResponse:
      type: object
      required:
        - albumBasicInfo
        - emoValueInfo
        - photoStorages
      properties:
        albumBasicInfo:
          type: object
          required:
            - name
            - createdAt
            - plannedDividend
          properties:
            name:
              type: string
              example: Family Album
            createdAt:
              type: string
              format: date
              example: '2026-02-01'
            plannedDividend:
              type:
                - string
                - 'null'
              format: date-time
              example: '2026-03-31T00:00:00.000Z'
        emoValueInfo:
          type: object
          required:
            - emoValue
            - dayOverDayChange
          properties:
            emoValue:
              type: number
              example: 8500
            dayOverDayChange:
              $ref: '#/components/schemas/EmoValueChange'
        photoStorages:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AlbumInsightPhotoStorage'
    AlbumInsightPhotoStorage:
      type: object
      required:
        - id
        - name
        - storagePath
        - photoCount
      properties:
        id:
          type: string
          example: ps_123
        name:
          type: string
          example: 2026-02-旅行
        storagePath:
          type: string
          example: 家族アルバム/2026-02-旅行
        photoCount:
          type: integer
          minimum: 0
          example: 8
    EmoValueChange:
      type: object
      required:
        - value
        - percentage
      properties:
        value:
          type: number
          example: 125
        percentage:
          type: number
          format: float
          example: 1.49
    DividendActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - REINVEST
            - RECEIVE
        photoStorageId:
          type: string
          description: Optional photo storage ID to target a single storage. When omitted, all active storages are processed.
    DividendActionResponse:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - REINVEST
            - RECEIVE
        processedStorages:
          type: integer
          description: Number of storages processed (present for immediate execution)
          example: 2
        events:
          type: array
          description: Dividend events created (present for immediate execution)
          items:
            type: object
            required:
              - id
              - photoStorageId
              - photoStorageName
              - emoValueAtEvent
              - previousBaseEmo
              - newBaseEmo
            properties:
              id:
                type: string
                example: evt_123
              photoStorageId:
                type: string
                example: ps_123
              photoStorageName:
                type: string
                example: '20260222120000'
              emoValueAtEvent:
                type: number
                example: 1500.5
              previousBaseEmo:
                type: integer
                example: 100
              newBaseEmo:
                type: integer
                example: 200
        approvalRequired:
          type: boolean
          description: True when the RECEIVE action requires group approval (SHARED albums only)
          example: true
        approvalRequests:
          type: array
          description: Created approval requests (present when approvalRequired=true)
          items:
            type: object
            required:
              - id
              - photoStorageName
              - emoValueAtRequest
              - expiresAt
              - approvals
            properties:
              id:
                type: string
                example: dar_123
              photoStorageName:
                type: string
                example: 2026-02-旅行
              emoValueAtRequest:
                type: number
                example: 1500.5
              expiresAt:
                type: string
                format: date-time
                example: '2026-02-28T00:00:00.000Z'
              approvals:
                type: array
                items:
                  type: object
                  required:
                    - userId
                    - userName
                    - isApproved
                  properties:
                    userId:
                      type: integer
                      example: 10
                    userName:
                      type: string
                      example: Taro
                    isApproved:
                      type: boolean
                      example: true
    ChartDataResponse:
      type: object
      required:
        - period
        - data
      properties:
        period:
          type: string
          enum:
            - 1W
            - 1M
            - 3M
            - 1Y
            - ALL
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'
    ChartDataPoint:
      type: object
      required:
        - time
        - value
      properties:
        time:
          type: string
          format: date
          example: '2026-02-21'
        value:
          type: number
          example: 8500
    MoodSentenceRequest:
      type: object
      required:
        - words
      properties:
        words:
          type: array
          minItems: 1
          items:
            type: string
          description: 心象に含めたい単語の配列
        includeRecommendation:
          type: boolean
          default: false
          description: When true, also generate "therefore you need to feel ~" text.
    MoodSentenceResponse:
      type: object
      required:
        - sentence
        - recordId
      properties:
        sentence:
          type: string
          description: 生成された心象を表す文章
        recommendationText:
          type: string
          description: Optional one-sentence encouragement based on mood (when includeRecommendation was true).
        recordId:
          type: string
          description: Created MoodRecord id
    SuggestedAlbumsResponse:
      type: object
      required:
        - suggestedAlbums
        - emotionSentence
      properties:
        suggestedAlbums:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedAlbumItem'
        emotionSentence:
          type: string
          description: The mood sentence used for suggestion
        message:
          type: string
          description: Optional message (e.g. when no albums)
    SuggestedAlbumItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: abc123
        name:
          type: string
          example: 家族アルバム
        reason:
          type: string
          description: Short reason why this album fits the mood
    SentenceRequest:
      type: object
      required:
        - words
      properties:
        words:
          type: array
          items:
            type: string
          example:
            - 猫
            - 走る
            - 公園
    SentenceResponse:
      type: object
      properties:
        sentence:
          type: string
          example: 公園で元気よく猫が走る様子を眺めていた。
        wordCount:
          type: integer
          example: 3
        usedWords:
          type: array
          items:
            type: string
          example:
            - 猫
            - 走る
            - 公園
    InsightOverviewResponse:
      type: object
      required:
        - totalEmoValue
        - totalDayOverDayChange
        - albums
      properties:
        totalEmoValue:
          type: number
          example: 25000.5
        totalDayOverDayChange:
          $ref: '#/components/schemas/EmoValueChange'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/InsightAlbumItem'
    InsightAlbumItem:
      type: object
      required:
        - id
        - name
        - albumType
        - groupName
        - emoValue
        - dayOverDayChange
      properties:
        id:
          type: string
          example: abc123
        name:
          type: string
          example: 家族アルバム
        albumType:
          $ref: '#/components/schemas/AlbumType'
        groupName:
          type:
            - string
            - 'null'
          example: null
        emoValue:
          type: number
          example: 8500
        dayOverDayChange:
          $ref: '#/components/schemas/EmoValueChange'
    DividendListResponse:
      type: object
      required:
        - pending
        - approvalRequests
        - completed
      properties:
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingDividendItem'
        approvalRequests:
          type: array
          description: Pending approval requests where the user is a group member
          items:
            $ref: '#/components/schemas/ApprovalRequestListItem'
        completed:
          type: array
          items:
            $ref: '#/components/schemas/CompletedDividendItem'
    PendingDividendItem:
      type: object
      required:
        - albumId
        - albumName
        - albumType
        - plannedDividend
        - photoStorageId
        - photoStorageName
        - photoCount
        - emoValue
        - tags
      properties:
        albumId:
          type: string
          example: abc123
        albumName:
          type: string
          example: 家族アルバム
        albumType:
          $ref: '#/components/schemas/AlbumType'
        plannedDividend:
          type: string
          format: date-time
          example: '2026-03-31T00:00:00.000Z'
        photoStorageId:
          type: string
          example: ps_123
        photoStorageName:
          type: string
          example: 2026-02-旅行
        photoCount:
          type: integer
          example: 8
        emoValue:
          type: number
          example: 1500.5
        tags:
          type: array
          items:
            type: string
          example:
            - 旅行
            - 家族
    CompletedDividendItem:
      type: object
      required:
        - dividendEventId
        - albumId
        - albumName
        - photoStorageId
        - photoStorageName
        - action
        - emoValueAtEvent
        - executedAt
      properties:
        dividendEventId:
          type: string
          example: evt_123
        albumId:
          type: string
          example: abc123
        albumName:
          type: string
          example: 家族アルバム
        photoStorageId:
          type: string
          example: ps_123
        photoStorageName:
          type: string
          example: 2026-02-旅行
        action:
          type: string
          enum:
            - REINVEST
            - RECEIVE
        emoValueAtEvent:
          type: number
          example: 1500.5
        executedAt:
          type: string
          format: date-time
          example: '2026-03-31T12:00:00.000Z'
    DividendEventDetailResponse:
      type: object
      required:
        - dividendEvent
        - album
        - photoStorage
      properties:
        dividendEvent:
          type: object
          required:
            - id
            - action
            - emoValueAtEvent
            - previousBaseEmo
            - newBaseEmo
            - executedAt
          properties:
            id:
              type: string
              example: evt_123
            action:
              type: string
              enum:
                - REINVEST
                - RECEIVE
            emoValueAtEvent:
              type: number
              example: 1500.5
            previousBaseEmo:
              type: integer
              example: 100
            newBaseEmo:
              type: integer
              example: 200
            executedAt:
              type: string
              format: date-time
              example: '2026-03-31T12:00:00.000Z'
        album:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              example: abc123
            name:
              type: string
              example: 家族アルバム
        photoStorage:
          type: object
          required:
            - id
            - name
            - photoCount
            - isCompoundActive
            - tags
